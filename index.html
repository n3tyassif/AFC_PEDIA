function remplirGrille(listeDeJeux, idDeLaGrille) {
    const grille = document.getElementById(idDeLaGrille);
    if (!grille) return; 

    grille.innerHTML = ""; 

    listeDeJeux.forEach(jeu => {
        const carte = document.createElement('div');
        carte.className = 'game-card';
       carte.onclick = () => ouvrirCarte(jeu.img, jeu.nom, jeu.twitch || "", jeu.statut || "");

        let badgeHTML = "";
        if (jeu.statut) {
            badgeHTML = `<div class="badge-statut ${jeu.statut}"></div>`;
        }

        // CORRECTION ICI : Utilise bien les backticks ` du début à la fin
        carte.innerHTML = `
            <div class="image-container">
                ${badgeHTML}
                <img src="${jeu.img}" alt="${jeu.nom}">
            </div>
            <p class="game-title">${jeu.nom}</p>
        `;
        grille.appendChild(carte);
    });
}
function ouvrirCarte(img, titre, twitch, statut) {
    const overlay = document.getElementById('game-overlay');
    const imgElement = document.getElementById('overlay-img');
    const titleElement = document.getElementById('overlay-title');

    imgElement.src = img;
    titleElement.innerText = titre;
    currentTwitch = twitch;
// 1. On nettoie toujours l'ancien badge avant
    const existingBadge = overlay.querySelector('.badge-modal');
    if (existingBadge) existingBadge.remove();

    // 2. On définit les statuts qui ont le droit à un badge
    const statutsAutorises = ["drop", "encours"];

    // 3. On vérifie si le statut actuel est dans la liste
    if (statut && statutsAutorises.includes(statut.toLowerCase())) {
        const badge = document.createElement('div');
        badge.className = `badge-modal ${statut.toLowerCase()}`;
        
        // Texte joli
        badge.innerText = statut.toUpperCase().replace("ENCOURS", "EN COURS");
        
        // Ajout au container
        const container = overlay.querySelector('.overlay-image-container');
        if (container) {
            container.appendChild(badge);
        } else {
            overlay.appendChild(badge);
        }
    }
    // Si c'est "Terminé" ou vide, le code s'arrête ici et ne crée rien.

    overlay.style.display = 'flex';
}
document.getElementById('game-overlay').onclick = function() {
    this.style.display = 'none';
};

};

                <div class="container-recherche-jeu">

                        <img src="${item.img}" class="img-resultat-recherche">

                </div>
            `;
            modal.style.display = "flex"; // Utilise "flex" si c'était ton réglage pour centrer
        }

        // On ferme les résultats de recherche
        const resultsDiv = document.getElementById('results');
        if (resultsDiv) resultsDiv.style.display = 'none';
        
        const barre = document.getElementById('recherche');
        if (barre) barre.value = '';
    }
};

window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
});


document.addEventListener('mouseleave', () => {
    mouse.x = -1000;
    mouse.y = -1000;

    if (hoveredObject) {
        hoveredObject.scale.set(1, 1, 1);
        hoveredObject = null;
    }
    canvas.style.cursor = 'default';
});
    let isVisible = true;

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        isVisible = entry.isIntersecting; 
    });
}, { threshold: 0.1 });

observer.observe(canvas);
let expansion = 0.1;

observer.observe(canvas);
renderer.outputColorSpace = THREE.SRGBColorSpace;
function animate() {
    requestAnimationFrame(animate);

    if (document.hidden || !isVisible) return; 

    const scrollY = window.scrollY;
    const waitScroll = 620;
    const progress = scrollY > waitScroll ? (scrollY - waitScroll) / 500 : 0;
    
    const baseRadius = (4 + (progress * 15)) * expansion;

    if (group) group.rotation.y += 0.002;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(group.children);

    // Gestion du curseur simplifiée
    if (intersects.length > 0) {
        if (hoveredObject !== intersects[0].object) {
            canvas.style.cursor = 'pointer';
            hoveredObject = intersects[0].object;
        }
    } else {
        if (hoveredObject !== null) {
            canvas.style.cursor = 'default';
            hoveredObject = null;
        }
    }

  for (let i = 0; i < group.children.length; i++) {
    const obj = group.children[i];
    const data = obj.userData;
    
    let targetRadius = baseRadius;
    if (hoveredObject === obj) targetRadius += 0.8; 

    if (obj.currentRadius === undefined) obj.currentRadius = targetRadius;
    
    const diff = targetRadius - obj.currentRadius;
    
    if (Math.abs(diff) > 0.001) {
        obj.currentRadius += diff * 0.1;
        
        const phi = data.phi;
        const theta = data.theta;
        const r = obj.currentRadius;
        obj.position.set(
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.cos(phi),
            r * Math.sin(phi) * Math.sin(theta)
        );
        obj.lookAt(0, 0, 0);
        
       
        obj.matrixWorldNeedsUpdate = true;
    }
}

    if (expansion < 1) {
        expansion += (1 - expansion) * 0.03; 
    }

    renderer.render(scene, camera);
    
}

animate();
function decodeEffect(elementId, targetText, speed = 1) {
    return new Promise((resolve) => {
        const element = document.getElementById(elementId);
        if (!element) return resolve();

        let iteration = 0;
        const japaneseChars = "フェミマースアーカイブ"; 
        const link = element.querySelector('a');
        const displayTarget = link ? link : element;
        element.style.visibility = 'visible';
        element.classList.add('decoding');

        const interval = setInterval(() => {
            displayTarget.innerText = targetText
                .split("")
                .map((letter, index) => {
                    if(index < iteration) {
                        return targetText[index]; 
                    }
                    return japaneseChars[Math.floor(Math.random() * japaneseChars.length)];
                })
                .join("");

            if(iteration >= targetText.length) {
                clearInterval(interval);
                resolve();
            }

            iteration += speed / 3; 
        }, 50);
    });
}


window.addEventListener('load', async () => {
    await decodeEffect('text-wiki', 'LE WIKI', 1); 

    await decodeEffect('text-femi', 'femimarss', 1); 
    const header = document.getElementById('header-anim');
    if(header) header.classList.add('reveal');
});


document.addEventListener("DOMContentLoaded", () => {
    // On cible tous les éléments qui ont un data-target
    const compteurs = document.querySelectorAll('[data-target]');
    
    compteurs.forEach(compteur => {
        const cible = +compteur.getAttribute('data-target');
        const dureeTotale = 2000; // L'animation durera 2 secondes pour TOUT LE MONDE
        const frameRate = 16; // Environ 60 images par seconde
        const totalFrames = dureeTotale / frameRate;
        
        // On calcule l'incrément spécifique pour ce nombre
        // Plus le nombre est grand, plus l'incrément sera fort
        const increment = cible / totalFrames; 
        
        let valeurActuelle = 0;

        const actualiser = () => {
            valeurActuelle += increment;
            
            if (valeurActuelle < cible) {
                compteur.innerText = Math.ceil(valeurActuelle);
                setTimeout(actualiser, frameRate);
            } else {
                // On s'assure d'afficher le chiffre exact à la fin
                compteur.innerText = cible;
            }
        };

        actualiser();
    });
});
document.addEventListener("DOMContentLoaded", () => {
    // On cible toutes les images du site
    const images = document.querySelectorAll('img');

    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                // On s'assure que le navigateur charge l'image seulement quand elle est proche
                img.src = img.src; 
                img.classList.add('fade-in'); // On ajoute un petit effet d'apparition
                observer.unobserve(img);
            }
        });
    }, {
        // On demande au navigateur de charger l'image 300px AVANT qu'elle arrive à l'écran
        rootMargin: "0px 0px 300px 0px"
    });

    images.forEach(img => imageObserver.observe(img));
});
